# Unified reid dataset / P stem-IN attention probe vs the L_cam teacher / 8 GB GPU
# Tests the IN-information-loss hypothesis: spatial IN discards instance
# statistics at 5 places in OSNet-AIN, which may be exactly what makes the
# L_cam teacher geometry (built on identity-specific statistics) sit at a
# terminal relational-KD loss of 0.77 for the CNN students. Architecture:
# osnet_ain_stem_x1_0_attn — ONLY the conv1 stem IN survives (1 IN instead
# of 5, OSBlockINin -> plain BN OSBlock) plus the gated 128-dim attention
# block. Distilled from the B flagship (B-ain-aug2-cam-jpeg, 93.50), warm
# start = P jpeg best 88.15 (the 4 converted blocks partially re-init:
# conv weights load, fresh BN/missing IN — expect an adaptation transient).
# PRIMARY metric: terminal relational-KD loss (toward the ViT-S reference
# 0.49 -> IN confirmed as the bottleneck; ~0.77 -> IN exonerated). Watch
# the attention gate: with instance statistics preserved it may finally
# recruit. Secondary: clean >= 88.15-0.1, probe (EXPECT some robustness
# loss from removing 4 INs — quantify the trade), officials.
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_p_8gb_distill_ain_aug2_jpeg/transformer_best_e000040_map0.88145.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_stem_x1_0_attn'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]
  JPEG_PROB: 0.5
  JPEG_QUALITY: [20, 90]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

CAMPROXY:
  ENABLED: True

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_aug2_cam_jpeg.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_aug2_cam_jpeg/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 0.0
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 140
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_osnet_p_8gb_distill_ain_stem_attn'
