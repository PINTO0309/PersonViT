# Unified 6-domain dataset / S student round (embed KD, cam2 teacher) / 8 GB GPU
# Student round on the d05-integrated set. Recipe = S's adopted best
# (embed KD 2.0, 384 -> 768 projector, CAMPROXY on, jpeg/CJ/blur);
# teacher = the NEW flagship B-synth-cam2 (93.594 legacy / d05 100 —
# L_cam geometry is representable by ViT-S). Warm start = the S embed
# best (93.029) passed through class-center init for the 8,119-id space.
# Validation = d00-d04, so train-log mAP reads against 93.029. Judge:
# legacy vs 93.029, d05 vs the S zero-shot baseline (measure first),
# probe/officials as usual.
# PRETRAIN_PATH regeneration:
#   python tools/init_classifier_centers.py --config configs/reid/vit_small_8gb_distill_ain_synth_embed.yml \
#     --weight "logs/reid_vit_small_8gb_distill_ain_aug2_jpeg_embed/transformer_best_*.pth" \
#     --output logs/reid_vit_small_8gb_distill_ain_aug2_jpeg_embed/centers_init_synth.pth
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_vit_small_8gb_distill_ain_aug2_jpeg_embed/centers_init_synth.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_small_ain_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]
  JPEG_PROB: 0.5
  JPEG_QUALITY: [20, 90]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

CAMPROXY:
  ENABLED: True

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_synth_cam_jpeg2.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_synth_cam_jpeg2/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 2.0
  EMBED_PROJ_DIM: 768
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 40
  BASE_LR: 0.00012
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  VAL_DOMAINS: [0, 1, 2, 3, 4]

OUTPUT_DIR: 'logs/reid_vit_small_8gb_distill_ain_synth_embed'
