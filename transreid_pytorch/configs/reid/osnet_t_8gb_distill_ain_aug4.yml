# Unified reid dataset / T-ain-aug4: continuation of the teacher-switch
# reshaping (Phase 3, docs/paper_findings_ablation_plan.md) / 8 GB GPU
# The aug3 round dipped to ~81 mAP while reshaping toward the
# B-ain-aug2-cam teacher (initial distill loss ~19) and was still
# recovering (+0.5 mAP / 10 epochs) when the 40-epoch schedule ran out.
# This round warm-starts from the aug3 FINAL state (checkpoint_last.pth,
# reshaped; for N the best file is epoch 1 = pre-reshape, so the last
# state is the right init) and gives the recovery a fresh 100-epoch
# cosine. Success bar: beat the aug2 best (P 87.81 / N 88.44 / T 88.61);
# otherwise the CNN tiers keep their aug2 lineage as final.
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_t_8gb_distill_ain_aug3/checkpoint_last.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_x1_5'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

CAMPROXY:
  ENABLED: True

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_aug2_cam.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_aug2_cam/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 0.0
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 100
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_osnet_t_8gb_distill_ain_aug4'
