# Unified reid dataset / P-ain no-distillation arm (teacher anchor OFF) / 8 GB GPU
# Companion to the relw10 arm: together with aug4 (REL 30) they form an
# anchor-strength gradient (30 -> 10 -> none) that isolates the student-side
# CAMPROXY contribution for the CNN family. Warm-starts from the undistorted
# aug2 best (87.81); ID + triplet + L_cam + aug only. Success bar: >= 88.0.
# Overfit guard: distillation is also a regularizer, so adoption REQUIRES
# the official splits to agree (the NPO lesson) — a unified-only gain is
# rejected.
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_p_8gb_distill_ain_aug2/transformer_best_e000038_map0.87806.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_x1_0'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

CAMPROXY:
  ENABLED: True

DISTILL:
  ENABLED: False
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_aug2_cam.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_aug2_cam/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 10.0
  EMBED_WEIGHT: 0.0
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 100
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_osnet_p_8gb_distill_ain_nokd'
