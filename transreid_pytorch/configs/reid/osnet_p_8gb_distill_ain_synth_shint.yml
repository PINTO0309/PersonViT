# Unified 6-domain dataset / P student round (rep + embed5 + spatial hint) / 8 GB GPU
# Student round on the d05-integrated set. Recipe = P's adopted best
# (rep branches + EMBED_WEIGHT 5.0 + spatial hint); teacher = the
# 6-domain NO-CAM teacher (92.3 legacy / d05 100, e40 — extracted to
# teacher_synth_e40.pth because the run's best-by-legacy-val file is the
# nearly-untrained e1; extract with:
#   python -c "import torch; s=torch.load('logs/reid_vit_base_8gb_ain_synth_jpeg/checkpoint_last.pth',map_location='cpu',weights_only=False); torch.save(s['model'],'logs/reid_vit_base_8gb_ain_synth_jpeg/teacher_synth_e40.pth')"
# ). Warm start = the P shint best (88.855, UNFOLDED) passed through
# class-center init for the 8,119-id space. Validation = d00-d04
# (train-log mAP reads against 88.855). Judge: legacy vs 88.855, d05,
# probe non-regression after fold.
# PRETRAIN_PATH regeneration:
#   python tools/init_classifier_centers.py --config configs/reid/osnet_p_8gb_distill_ain_synth_shint.yml \
#     --weight "logs/reid_osnet_p_8gb_distill_ain_aug3_jpeg_rep_embed5_shint/transformer_best_*.pth" \
#     --output logs/reid_osnet_p_8gb_distill_ain_aug3_jpeg_rep_embed5_shint/centers_init_synth.pth
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_p_8gb_distill_ain_aug3_jpeg_rep_embed5_shint/centers_init_synth.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_x1_0_rep'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]
  JPEG_PROB: 0.5
  JPEG_QUALITY: [20, 90]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_synth_jpeg.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_synth_jpeg/teacher_synth_e40.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 5.0
  HINT_WEIGHT: 2.0
  HINT_MODE: 'spatial'
  HINT_BLOCK: -1
  EMBED_PROJ_DIM: 768
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 40
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  VAL_DOMAINS: [0, 1, 2, 3, 4]

OUTPUT_DIR: 'logs/reid_osnet_p_8gb_distill_ain_synth_shint'
