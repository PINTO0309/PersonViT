# Unified reid dataset / P embed-KD dose + intermediate hint arm / 8 GB GPU
# NOTE: superseded as the first-run by ..._rep_embed5_shint.yml (spatial
# hint); this global-hint variant is kept as the ablation fallback.
# Ladder step 4, deliberately COMBINED (user decision): two changes vs the
# adopted rep_embed best (88.591) — (a) EMBED_WEIGHT 2.0 -> 5.0
# (dose-response probe: the untuned 2.0 already gave +0.31), and
# (b) DISTILL.HINT_WEIGHT 2.0: FitNets-style intermediate hint — pooled
# conv4 (512) -> loss-only hint_proj (512 -> 768) -> cosine toward the
# teacher's final embedding, a mid-network gradient shortcut. Warm start =
# rep_embed best (unfolded; embed_proj reloads, hint_proj is new).
# Attribution caveat: if this arm wins, the credit is shared between (a)
# and (b); split them only if the combined result warrants it. Expect an
# e1 Distill spike (5x embed term + fresh hint projector). Judge: clean
# vs 88.591, terminal combined Distill trends (not comparable across
# weight changes), probe non-regression after fold.
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_p_8gb_distill_ain_aug3_jpeg_rep_embed/transformer_best_e000038_map0.88591.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_x1_0_rep'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]
  JPEG_PROB: 0.5
  JPEG_QUALITY: [20, 90]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_aug2_jpeg.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_aug2_jpeg/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 5.0
  HINT_WEIGHT: 2.0
  EMBED_PROJ_DIM: 768
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 40
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_osnet_p_8gb_distill_ain_aug3_jpeg_rep_embed5_hint'
