# Unified reid dataset / distill ViT-B/16 teacher -> ViT-S/16 student / 16GB GPU
# Student settings mirror vit_small_16gb.yml; the frozen teacher adds a forward
# pass without gradients (see vit_small_16gb.yml for the student baseline footprint).
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '../pretrained/checkpoint0220.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_small_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_16gb.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_16gb/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 0.0
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60
  BASE_LR: 0.0008
  WARMUP_EPOCHS: 10
  IMS_PER_BATCH: 128
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_vit_small_16gb_distill'
