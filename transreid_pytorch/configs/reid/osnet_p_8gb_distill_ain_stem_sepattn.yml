# Unified reid dataset / P entrance separable-attention probe / 8 GB GPU
# Entrance-attention design: one O(N) separable self-attention block
# (MobileViTv2-style: softmax context scores -> single context vector ->
# gated residual, ~12k params, +2.6% MACs) right after the stem
# (post-IN/maxpool, 64ch 64x32 = 2048 tokens), on the stem-IN-only
# architecture (1 InstanceNorm instead of 5), KEEPING the gated tail
# LiteSelfAttention (128-dim). The tail block self-suppressed in all three
# prior environments, but it is retained by decision: entrance context may
# change what the tail sees, and its gate is a free readout of that
# interaction. Rationale for the entrance block: placement ahead of the
# conv stack lets every stage process globally-contextualized features,
# and separable attention makes the 16x token count affordable (quadratic
# attention would cost +55% MACs there). Sequencing: start AFTER the
# stem_attn run's verdict — this arm shares the stem-IN-only change, so
# run it against whichever baseline that verdict establishes. Watch BOTH
# gates (base.stem_attn.gate entrance / base.attn.gate tail) for the
# self-suppression signature; PRIMARY metrics: gate trajectories +
# terminal relational-KD loss vs the stem_attn arm's, clean >= 88.15-0.1.
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_p_8gb_distill_ain_aug2_jpeg/transformer_best_e000040_map0.88145.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_stem_x1_0_sepattn'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]
  JPEG_PROB: 0.5
  JPEG_QUALITY: [20, 90]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

CAMPROXY:
  ENABLED: True

DISTILL:
  ENABLED: True
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_aug2_cam_jpeg.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_aug2_cam_jpeg/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 30.0
  EMBED_WEIGHT: 0.0
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 140
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_osnet_p_8gb_distill_ain_stem_sepattn'
