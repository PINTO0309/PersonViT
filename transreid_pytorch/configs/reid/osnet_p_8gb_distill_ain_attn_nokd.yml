# Unified reid dataset / P-ain-attn-nokd: LiteSelfAttention, no teacher / 8 GB GPU
# Companion to osnet_p_8gb_distill_ain_attn.yml: same architecture change
# (one bottlenecked residual self-attention block after conv5, zero-gate
# identity at init) but with the teacher anchor OFF — measures the
# standalone value of global-relation modeling for the CNN (ID + triplet
# + L_cam + aug only). Warm-starts from the aug2 best (87.81). Success
# bar: >= 88.0 with official splits agreeing (the NPO lesson).
# v2 note: the first run of this arm died silently — the zero gate
# blocked all gradients into the block and weight decay eroded it to
# zero (reduce.weight norm -> 0.0). Fixed by gate init 0.01 + weight
# decay exemption for .attn. parameters; OUTPUT_DIR bumped to keep the
# pathological run separate.
MODEL:
  PRETRAIN_CHOICE: 'self'
  PRETRAIN_PATH: 'logs/reid_osnet_p_8gb_distill_ain_aug2/transformer_best_e000038_map0.87806.pth'
  PRETRAIN_HW_RATIO: 1
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'osnet_ain_x1_0_attn'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ_PROB: 0.5
  CJ_BRIGHTNESS: 0.2
  CJ_CONTRAST: 0.3
  CJ_SATURATION: 0.2
  CJ_HUE: 0.02
  BLUR_PROB: 0.15
  BLUR_SIGMA: [0.1, 2.0]

DATASETS:
  NAMES: ('reid')
  ROOT_DIR: ('./data/')

DATALOADER:
  SAMPLER: 'domain_balanced_triplet'
  DOMAIN_ALPHA: 0.5
  NUM_INSTANCE: 4
  NUM_WORKERS: 16

CAMPROXY:
  ENABLED: True

DISTILL:
  ENABLED: False
  TEACHER_CONFIG: 'configs/reid/vit_base_8gb_ain_aug2_cam.yml'
  TEACHER_WEIGHT: 'logs/reid_vit_base_8gb_ain_aug2_cam/transformer_best_*.pth'
  LOGIT_WEIGHT: 1.0
  REL_WEIGHT: 10.0
  EMBED_WEIGHT: 0.0
  TEMPERATURE: 4.0

SOLVER:
  OPTIMIZER_NAME: 'Adam'
  MAX_EPOCHS: 100
  BASE_LR: 0.0001
  WARMUP_EPOCHS: 5
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  SAVE_BEST: True
  LOG_PERIOD: 50
  EVAL_PERIOD: 1
  WEIGHT_DECAY:  5e-4
  WEIGHT_DECAY_BIAS: 5e-4
  BIAS_LR_FACTOR: 1

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/reid_osnet_p_8gb_distill_ain_attn_nokd2'
